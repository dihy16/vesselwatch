<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0B2E5D" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- blue hull -->
    <path d="M32 3.8
             C34.7 4.1 44.4 18.5 46.0 23.0
             L46.0 43.0
             C45.6 48.3 40.4 56.2 36.5 60.0
             H27.5
             C23.6 56.2 18.4 48.3 18.0 43.0
             L18.0 23.0
             C19.6 18.5 29.3 4.1 32 3.8Z"
          fill="#1976D2"
          stroke="#0C4A91"
          stroke-width="2.2"
          stroke-linejoin="round"/>

    <!-- white inset hull outline -->
    <path d="M32 7.0
             C34.0 7.3 41.2 18.7 42.5 22.6
             L42.5 42.1
             C42.2 46.0 38.1 52.6 35.1 56.3
             H28.9
             C25.9 52.6 21.8 46.0 21.5 42.1
             L21.5 22.6
             C22.8 18.7 30.0 7.3 32 7.0Z"
          stroke="#FFFFFF"
          stroke-width="2.1"
          stroke-linejoin="round"/>

    <!-- bow marker -->
    <circle cx="32" cy="15" r="2.8" fill="#FFFFFF"/>

    <!-- bridge -->
    <rect x="25" y="20.5" width="14" height="5.8" rx="1.7" fill="#FFFFFF"/>

    <!-- main deck / hold -->
    <rect x="24.4" y="30" width="15.2" height="16" rx="1.1"
          stroke="#FFFFFF" stroke-width="2.3"/>
    <path d="M25.8 38H38.2" stroke="#FFFFFF" stroke-width="2.0" stroke-linecap="round"/>

    <!-- stern block -->
    <rect x="25.2" y="50" width="13.6" height="3.8" rx="1.5" fill="#FFFFFF"/>
  </g>
</svg>
